<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#gradient)"/>
  
  <!-- Grid pattern for engineering aesthetic -->
  <defs>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#grid)"/>
  
  <!-- ESA Logo Area -->
  <circle cx="960" cy="440" r="100" fill="rgba(255, 107, 53, 0.1)" stroke="#FF6B35" stroke-width="2"/>
  
  <!-- Play button -->
  <circle cx="960" cy="540" r="60" fill="rgba(255, 107, 53, 0.8)"/>
  <polygon points="940,520 940,560 980,540" fill="white"/>
  
  <!-- ESA Text -->
  <text x="960" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FF6B35">ESA</text>
  
  <!-- Subtitle -->
  <text x="960" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)">Bureau d'Études Structures</text>
  <text x="960" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">Excellence en Ingénierie Structurelle</text>
  
  <!-- Decorative elements -->
  <rect x="760" y="780" width="400" height="2" fill="url(#gradient2)"/>
  <defs>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent" />
      <stop offset="50%" style="stop-color:#FF6B35" />
      <stop offset="100%" style="stop-color:transparent" />
    </linearGradient>
  </defs>
  
  <!-- Technical drawing elements -->
  <g stroke="rgba(255, 107, 53, 0.3)" stroke-width="1" fill="none">
    <rect x="100" y="100" width="200" height="150"/>
    <rect x="1620" y="830" width="200" height="150"/>
    <line x1="100" y1="100" x2="150" y2="50"/>
    <line x1="300" y1="100" x2="350" y2="50"/>
    <line x1="1620" y1="830" x2="1570" y2="780"/>
    <line x1="1820" y1="830" x2="1870" y2="780"/>
  </g>
</svg>